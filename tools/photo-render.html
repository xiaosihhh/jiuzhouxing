<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>城市实景封面生成器</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{width:100%;height:100%;overflow:hidden;background:#0f172a}
    body{font-family:"Microsoft YaHei UI","Microsoft YaHei",sans-serif}
    .cover{position:relative;width:1200px;height:750px;overflow:hidden;color:#fff;background:#111}
    .photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
    .shade{position:absolute;inset:0;background:
      linear-gradient(90deg,rgba(4,10,22,.88) 0%,rgba(4,10,22,.54) 43%,rgba(4,10,22,.12) 73%,rgba(4,10,22,.32) 100%),
      linear-gradient(0deg,rgba(4,10,22,.78) 0%,transparent 46%)}
    .content{position:absolute;inset:0;padding:68px 76px;display:flex;flex-direction:column;justify-content:space-between}
    .top{display:flex;justify-content:space-between;align-items:center}
    .brand{display:flex;align-items:center;gap:12px;font-weight:800;font-size:22px;text-shadow:0 2px 8px rgba(0,0,0,.4)}
    .mark{font-size:30px}
    .region{padding:9px 16px;border:1px solid rgba(255,255,255,.3);border-radius:999px;background:rgba(10,18,35,.34);backdrop-filter:blur(10px);font-size:15px;font-weight:700}
    .main{max-width:760px}
    .eyebrow{font-size:14px;font-weight:700;letter-spacing:.2em;margin-bottom:14px;opacity:.88}
    h1{font-size:96px;line-height:1;font-weight:900;letter-spacing:-.055em;text-shadow:0 8px 30px rgba(0,0,0,.45)}
    .desc{margin-top:20px;max-width:690px;font-size:22px;line-height:1.62;color:rgba(255,255,255,.92);text-shadow:0 2px 10px rgba(0,0,0,.45)}
    .footer{display:flex;justify-content:space-between;align-items:flex-end;font-size:13px;color:rgba(255,255,255,.76)}
    .source{padding:7px 11px;border-radius:8px;background:rgba(0,0,0,.28)}
  </style>
</head>
<body>
  <div class="cover">
    <img class="photo" id="photo" alt="" />
    <div class="shade"></div>
    <div class="content">
      <div class="top">
        <div class="brand"><span class="mark">◈</span><span>九州行</span></div>
        <div class="region" id="region">中国旅行</div>
      </div>
      <div class="main">
        <div class="eyebrow">JOURNEY ACROSS CHINA</div>
        <h1 id="name">中国</h1>
        <div class="desc" id="desc">读懂中国山河，规划下一段旅程</div>
      </div>
      <div class="footer">
        <span>城市灵感 · 景点 · 住宿 · 路线</span>
        <span class="source">实景图片素材：Pixabay</span>
      </div>
    </div>
  </div>
  <script>
    const params=new URLSearchParams(location.search);
    const set=(id,value)=>{document.getElementById(id).textContent=value||""};
    set("name",params.get("name")||"中国");
    set("region",params.get("region")||"中国旅行");
    set("desc",params.get("desc")||"读懂中国山河，规划下一段旅程");
    const image=document.getElementById("photo");
    image.onload=()=>document.documentElement.dataset.ready="true";
    image.onerror=()=>document.documentElement.dataset.error="true";
    image.src=params.get("image")||"";
  </script>
</body>
</html>
